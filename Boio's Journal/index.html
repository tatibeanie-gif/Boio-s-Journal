<!DOCTYPE html>
<html>
<head>
  <title>Boio's Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="text-block">
    <h1>Boio's Journal</h1>
    <p>It's your turn to explore his notes, don't hesitate to zoom, click, and maybe discover some surprises!</p>
  </div>

  <img class="draggable-image" id="monImage" src="images/intronotes.png" style="left: 50px; top: 50px;">
  <img class="draggable-image" id="introArt" src="images/introart.png" style="left: 260px; top: 50px;">

  <audio id="customMusic" loop></audio>
  <audio id="paperSound"></audio>

  <script>
    const images = document.querySelectorAll('.draggable-image');
    const customMusic = document.getElementById('customMusic');
    const paperSound = document.getElementById('paperSound');
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    let ambientStarted = false;
    let ambientGain = null;
    let melodyTimer = null;
    const melodyNotes = [261.63, 293.66, 329.63, 392.0, 440.0, 392.0, 329.63, 293.66, 261.63];

    // Put your downloaded music file in the project folder, then set its name here.
    // Example: customMusic.src = 'audio/music.mp3';
    customMusic.src = 'audio/musiqueceltique.mp3';

    // Put your downloaded paper sound file in the project folder, then set its name here.
    // Example: paperSound.src = 'audio/paper.mp3';
    paperSound.src = 'audio/papier.mp3';

    function startAudio() {
      if (ambientStarted) return;
      ambientStarted = true;

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }

      customMusic.volume = 0.35;
      customMusic.play().catch(() => {});
    }

    function playPaperSound() {
      if (!paperSound.src) return;

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }

      paperSound.currentTime = 0;
      paperSound.volume = 0.25;
      paperSound.play().catch(() => {});
    }

    document.addEventListener('click', startAudio, { once: true });
    document.addEventListener('wheel', startAudio, { once: true });
    document.addEventListener('touchstart', startAudio, { once: true });

    images.forEach((img) => {
      img.style.position = 'absolute';
      img.style.cursor = 'move';
      img.style.userSelect = 'none';
      img.ondragstart = () => false;

      let scale = 1;

      img.onwheel = function (e) {
        e.preventDefault();
        startAudio();
        playPaperSound();
        const zoomFactor = 0.1;
        scale += e.deltaY < 0 ? zoomFactor : -zoomFactor;
        scale = Math.max(0.7, Math.min(2.5, scale));
        img.style.transform = `scale(${scale})`;
      };

      img.onmousedown = function (e) {
        e.preventDefault();
        startAudio();
        playPaperSound();

        const shiftX = e.clientX - img.getBoundingClientRect().left;
        const shiftY = e.clientY - img.getBoundingClientRect().top;

        function moveAt(clientX, clientY) {
          img.style.left = clientX - shiftX + 'px';
          img.style.top = clientY - shiftY + 'px';
        }

        moveAt(e.clientX, e.clientY);

        function onMouseMove(event) {
          moveAt(event.clientX, event.clientY);
        }

        document.addEventListener('mousemove', onMouseMove);

        document.onmouseup = function () {
          document.removeEventListener('mousemove', onMouseMove);
          document.onmouseup = null;
        };
      };
    });
  </script>
</body>
</html>
