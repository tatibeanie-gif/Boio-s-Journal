<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Boio's Journal</title>
  <link rel="stylesheet" href="style.css?v=20260725-2">
</head>
<body>
  <div class="text-block">
    <h1>Boio's Journal</h1>
    <p>Welcome in your new journey, don't hesitate to drag,zoom, click, and maybe discover some surprises!</p>
  </div>

  <div class="image-stage" id="stage1" style="left: 50px; top: 50px;">
    <img class="draggable-image" id="monImage" src="images/intronotes.png">
    <button class="note-hotspot" data-note="Boio is an old forest druid, sent on a mission to gather as much information as possible about the human realm." style="left: 165px; top: 130px;"></button>
  </div>

  <div class="image-stage" id="stage2" style="left: 260px; top: 50px;">
    <img class="draggable-image" id="introArt" src="images/introart.png">
    <button class="note-hotspot" data-note="Boio never figured out who Tatiana was and why her name was on his book. But he decided to not erase it, afraid he would be cursed" style="left: 80px; top: 390px;"></button>
  </div>

  <div id="notePopup" class="note-popup">A mysterious note appears here...</div>

  <audio id="customMusic" loop></audio>
  <audio id="paperSound"></audio>

  <script>
    const images = document.querySelectorAll('.draggable-image');
    const stages = document.querySelectorAll('.image-stage');
    const customMusic = document.getElementById('customMusic');
    const paperSound = document.getElementById('paperSound');
    const notePopup = document.getElementById('notePopup');
    const noteHotspots = document.querySelectorAll('.note-hotspot');
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    let ambientStarted = false;
    let ambientGain = null;
    let melodyTimer = null;
    const melodyNotes = [261.63, 293.66, 329.63, 392.0, 440.0, 392.0, 329.63, 293.66, 261.63];

    // Put your downloaded music file in the project folder, then set its name here.
    // Example: customMusic.src = 'audio/music.mp3';
    customMusic.src = 'audio/musiqueceltique.mp3';

    // Put your downloaded paper sound file in the project folder, then set its name here.
    // Example: paperSound.src = 'audio/paper.mp3';
    paperSound.src = 'audio/papier.mp3';

    function startAudio() {
      if (ambientStarted) return;
      ambientStarted = true;

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }

      customMusic.volume = 0.35;
      customMusic.play().catch(() => {});
    }

    function playPaperSound() {
      if (!paperSound.src) return;

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }

      paperSound.currentTime = 0;
      paperSound.volume = 0.25;
      paperSound.play().catch(() => {});
    }

    noteHotspots.forEach((button) => {
      button.type = 'button';
      const showNote = (e) => {
        e.stopPropagation();
        const rect = button.getBoundingClientRect();
        const popupWidth = 260;
        const popupHeight = 90;
        const left = Math.min(window.innerWidth - popupWidth - 12, Math.max(12, rect.left + rect.width / 2 - popupWidth / 2));
        const top = Math.min(window.innerHeight - popupHeight - 12, Math.max(12, rect.top + rect.height / 2 - popupHeight / 2));

        notePopup.textContent = button.getAttribute('data-note');
        notePopup.style.left = `${left}px`;
        notePopup.style.top = `${top}px`;
        notePopup.style.display = 'block';
      };

      button.addEventListener('click', showNote);
      button.addEventListener('pointerdown', showNote);
    });

    document.addEventListener('click', () => {
      notePopup.style.display = 'none';
    });

    document.addEventListener('click', startAudio, { once: true });
    document.addEventListener('wheel', startAudio, { once: true });
    document.addEventListener('touchstart', startAudio, { once: true });

    stages.forEach((stage) => {
      const img = stage.querySelector('img');
      img.style.position = 'relative';
      img.style.cursor = 'move';
      img.style.userSelect = 'none';
      img.ondragstart = () => false;

      let scale = 1;

      img.onwheel = function (e) {
        e.preventDefault();
        startAudio();
        playPaperSound();
        const zoomFactor = 0.1;
        scale += e.deltaY < 0 ? zoomFactor : -zoomFactor;
        scale = Math.max(0.7, Math.min(2.5, scale));
        stage.style.transform = `scale(${scale})`;
      };

      img.onmousedown = function (e) {
        e.preventDefault();
        startAudio();
        playPaperSound();

        const shiftX = e.clientX - stage.getBoundingClientRect().left;
        const shiftY = e.clientY - stage.getBoundingClientRect().top;

        function moveAt(clientX, clientY) {
          stage.style.left = clientX - shiftX + 'px';
          stage.style.top = clientY - shiftY + 'px';
        }

        moveAt(e.clientX, e.clientY);

        function onMouseMove(event) {
          moveAt(event.clientX, event.clientY);
        }

        document.addEventListener('mousemove', onMouseMove);

        document.onmouseup = function () {
          document.removeEventListener('mousemove', onMouseMove);
          document.onmouseup = null;
        };
      };
    });
  </script>
</body>
</html>
